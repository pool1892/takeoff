[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "takeoff-suppliers"
version = "0.1.0"
description = "Remote, resettable supplier market for the Takeoff procurement demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "websockets>=14,<17",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
takeoff-suppliers = "takeoff_suppliers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
takeoff_suppliers = ["fixtures/*.json", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
